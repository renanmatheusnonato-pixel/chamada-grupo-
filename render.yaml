# Deploy do servidor no Render (Blueprint): https://render.com/docs/blueprint-spec
# ponytail: plano free não aceita disco — data.json é apagado a cada reinício/deploy.
# Para o histórico persistir, mude plan para "starter" e volte a declarar o bloco disk.
services:
  - type: web
    name: chamada-grupo-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
